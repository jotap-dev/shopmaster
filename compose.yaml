# Desenvolvimento local.
#
# Dois containers, como em produção: o nginx fala HTTP, o php-fpm executa o
# PHP. Eles NÃO são um dentro do outro — são irmãos, e conversam por FastCGI.
#
# Postgres e Redis rodam no HOST (Homebrew), não em container: é o setup local
# deste projeto. Na VPS eles são containers compartilhados — ver docs/docker.md.

services:
  nginx:
    build:
      context: .
      target: nginx
    image: shopmaster-nginx:dev
    ports:
      # Porta do projeto: 8001 no host, 80 dentro do container.
      # A 8000 é disputada — outro projeto, um túnel SSH, um servidor de
      # desenvolvimento. Trocar é pontual: APP_PORT=9005 docker compose up -d
      - "${APP_PORT:-8001}:80"
    depends_on:
      - php
    restart: unless-stopped

  php:
    build:
      context: .
      # O Dockerfile tem três alvos. Sem declarar, o build pegaria o último do
      # arquivo — que é o nginx.
      target: dev
    image: shopmaster:dev
    volumes:
      # Código montado do host: editar uma classe reflete sem rebuild.
      - .:/app
      # Volume anônimo protegendo o vendor/ instalado na imagem — sem ele o
      # bind mount acima o esconderia e o container sobe sem dependências.
      - /app/vendor
    environment:
      DB_HOST: host.docker.internal
      REDIS_HOST: host.docker.internal
      # Acompanha a porta publicada pelo nginx. Sem isto, URL gerada fora de
      # uma requisição — job de fila, comando de console — sairia errada.
      APP_URL: http://localhost:${APP_PORT:-8001}
    # No macOS o host.docker.internal resolve sozinho; no Linux, não. No
    # Colima aponta para o mesmo IP, então declarar é seguro nos dois.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Worker da fila (e-mail transacional, webhook de pagamento) — Fase 9.
  #   docker compose --profile worker up -d
  worker:
    build:
      context: .
      target: dev
    image: shopmaster:dev
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    volumes:
      - .:/app
      - /app/vendor
    environment:
      DB_HOST: host.docker.internal
      REDIS_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - php
    restart: unless-stopped
    profiles: [worker]
