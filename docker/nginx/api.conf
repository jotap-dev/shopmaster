# nginx na frente de uma aplicação Laravel, via FastCGI.
#
# A divisão de trabalho: o nginx fala HTTP com o mundo e NÃO sabe executar
# PHP. O php-fpm executa PHP e NÃO sabe falar HTTP. Eles conversam por
# FastCGI, um protocolo binário, na porta 9000 da rede interna do Docker.
#
# `php` é o nome do serviço no compose — resolvido pelo DNS do Docker.

server {
    listen 80;
    server_name _;

    # O document root é o `public/`, nunca a raiz do projeto. Apontar para
    # `/app` exporia `.env`, `vendor/`, `storage/` e todo o código-fonte a
    # quem soubesse o caminho do arquivo.
    root /app/public;
    index index.php;

    charset utf-8;

    # Log no stdout/stderr para o Docker coletar. Arquivo dentro do container
    # seria perdido na recriação e invisível ao `docker compose logs`.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # O padrão do nginx é 1 MB, e a mensagem de erro quando estoura (413) não
    # diz o que fazer. Melhor explícito.
    client_max_body_size 8m;

    # O coração do roteamento de qualquer app PHP moderna: se o caminho pedido
    # não existe como arquivo nem como diretório, entrega ao index.php, que é
    # o front controller do Laravel.
    #
    # É por isso que /v1/auth/register funciona sem existir diretório algum
    # com esse nome.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Só o index.php é executável. Uma regra genérica `location ~ \.php$`
    # permitiria executar qualquer .php que chegasse ao disco — é o vetor
    # clássico de upload malicioso.
    location = /index.php {
        fastcgi_pass php:9000;

        # Traz os defaults do FastCGI (REQUEST_METHOD, QUERY_STRING, etc.).
        include fastcgi_params;

        # O caminho que o php-fpm vai abrir. Atenção: é o caminho de DENTRO do
        # container do php-fpm — os dois precisam concordar sobre onde o
        # código está.
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Requisição longa morreria no default de 60s.
        fastcgi_read_timeout 60s;

        # Com buffer, o PHP entrega a resposta e é liberado; sem ele, ficaria
        # preso esperando um cliente lento terminar de receber.
        fastcgi_buffering on;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Arquivo oculto não é servido — .env, .git, .htaccess. A exceção é o
    # desafio da Let's Encrypt, caso um dia se use o challenge HTTP-01.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
