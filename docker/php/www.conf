; Pool do php-fpm — sobrescreve o www.conf da imagem oficial.
;
; O que importa aqui é QUANTOS processos sobem: cada um é um PHP inteiro na
; memória, e cada um atende uma requisição por vez.

[www]
user = www-data
group = www-data

; TCP e não socket Unix: o nginx está em OUTRO container, e socket de arquivo
; não atravessa essa fronteira sem volume compartilhado.
listen = 9000

; `dynamic`: sobe alguns e cria mais sob demanda, até o teto.
; `ondemand` economizaria memória parado, ao custo de latência na primeira
; requisição; `static` fixa o número e desperdiça quando está ocioso.
pm = dynamic

; Dimensionado para os 2 núcleos da VPS. PHP é síncrono: um processo parado
; esperando o banco não usa CPU, então vale ter mais processos que núcleos —
; mas cada um custa memória.
;
; A conta: max_children x memória por processo tem de caber no limite do
; container (512M no compose). ~40 MB por processo nesta app -> 10 x 40 = 400 MB.
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4

; Recicla o processo depois de N requisições. É a rede de segurança contra
; vazamento de memória em dependência de terceiro: em vez de crescer até o
; limite, o processo morre e nasce limpo.
pm.max_requests = 500

; Exposto para diagnóstico e para o healthcheck.
ping.path = /ping
pm.status_path = /status

; Log do PHP no stderr do container, para o `docker compose logs` enxergar.
catch_workers_output = yes
decorate_workers_output = no
